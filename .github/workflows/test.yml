# Every push and pull request: the whole test suite against MariaDB, as on a real site (100% coverage required),
# plus a check that the Docker image builds and the tests of the version-check Worker (worker/).
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-24.04
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: dev
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get install -y --no-install-recommends poppler-utils
      - run: uv run pytest
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile .
  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test worker/test.mjs
