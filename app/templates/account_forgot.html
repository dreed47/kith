{% extends "base.html" %}
{% block title %}Forgot your password · {{ super() }}{% endblock %}
{% block content %}
<div class="narrow">
<h1>Forgot your password?</h1>
<p class="muted">Enter your username or email address. We'll email you a link to choose a new password.</p>
{% if error %}<p class="card error" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="card edit-form">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Username or email <input name="who" required autocomplete="username"></label>
  <div class="form-actions"><button>Send the link</button><a href="{{ url_for('auth.login') }}">Cancel</a></div>
</form>
</div>
{% endblock %}
