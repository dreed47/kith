{% extends "base.html" %}
{% block title %}Census by year · {{ super() }}{% endblock %}
{% block content %}
<h1>Census by year</h1>
<p><a href="{{ url_for('places.places') }}">Places</a></p>
{% if years %}
<ul class="surnames">
  {% for y, n in years %}<li><a href="{{ url_for('places.census', year=y|int) }}">{{ y }}</a> <span class="muted">{{ n }}</span></li>{% endfor %}
</ul>
{% else %}<p>No dated census records yet.</p>{% endif %}
{% endblock %}
