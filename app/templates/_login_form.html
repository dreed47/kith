<form class="card login-form" method="post" action="{{ url_for('auth.login') }}">
  <h2>Log in</h2>
  <p class="muted small">Welcome back. Use the username you were given.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <input type="hidden" name="next" value="{{ next or '' }}">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Username <input name="username" autocomplete="username" required></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="wide">Log in</button>
  <p class="small"><a href="{{ url_for('account.forgot') }}">Forgot your password?</a> · <a href="{{ url_for('account.request_account') }}">Ask for an account</a></p>
</form>
